[project]
name = "vizml"
version = "0.1.0"
description = "A visual, shape-aware PyTorch architecture workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "torch>=2.6,<3",
  "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
