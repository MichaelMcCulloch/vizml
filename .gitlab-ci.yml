stages: [test, build, deploy]
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

.buildkit:
  image: registry.semanticallyinvalid.net/michaelmcculloch/shared-cicd-images/docker:cli
  services:
    - name: registry.semanticallyinvalid.net/michaelmcculloch/shared-cicd-images/docker:dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --name "vizml-$CI_JOB_ID" --driver docker-container --use
    - docker buildx inspect --bootstrap

.build-image:
  extends: .buildkit
  stage: build
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/$COMPONENT"
      docker buildx build --file "docker/$COMPONENT.Dockerfile" \
        --cache-from "type=registry,ref=$IMAGE:buildcache" \
        --cache-from "type=registry,ref=$IMAGE:latest" \
        --cache-to type=inline \
        --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true,oci-mediatypes=true" \
        --tag "$IMAGE:$IMAGE_TAG" --tag "$IMAGE:latest" --push .
      mkdir -p build-info
      echo "$IMAGE_TAG" > "build-info/$COMPONENT"
  artifacts:
    paths: [build-info/]
    expire_in: 1 day

build_frontend:
  extends: .build-image
  variables: { COMPONENT: frontend }
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [src/**/*, scripts/**/*, templates/**/*, public/**/*, index.html, package.json, bun.lock, patches/**/*, tsconfig.json, docker/frontend.Dockerfile, .dockerignore, .gitlab-ci.yml]

build_engine:
  extends: .build-image
  variables: { COMPONENT: engine }
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [backend/**/*, pyproject.toml, uv.lock, docker/engine-deps/**/*, docker/engine.Dockerfile, .dockerignore, .gitlab-ci.yml]

test_frontend:
  stage: test
  image: oven/bun:1.4.4
  script:
    - bun install --frozen-lockfile
    - bun run build
    - bun test scripts/server.test.ts scripts/connections.test.ts scripts/graph-view.test.ts scripts/recurrent.test.ts
    - cp "$(command -v bun)" bun-ci
  artifacts:
    paths: [bun-ci]
    expire_in: 1 day

test_engine:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  needs: [test_frontend]
  script:
    - cp docker/engine-deps/pyproject.toml docker/engine-deps/uv.lock .
    - uv sync --locked
    - uv run --locked pytest backend/tests -q
    - ./bun-ci test scripts/model.test.mjs

bump_manifests:
  stage: deploy
  image: registry.semanticallyinvalid.net/michaelmcculloch/shared-cicd-images/alpine:3.20
  needs:
    - { job: build_frontend, optional: true, artifacts: true }
    - { job: build_engine, optional: true, artifacts: true }
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apk add --no-cache git curl openssl
    - |
      built=""
      for component in frontend engine; do [ ! -f "build-info/$component" ] || built="$built $component"; done
      [ -n "$built" ] || { echo 'No images built'; exit 0; }
      : "${GITOPS_TOKEN:?GITOPS_TOKEN must have repository write access}"
      git fetch origin deploy
      git checkout -B deploy origin/deploy
      sh deploy/ci/bump-tags.sh "$built"
      git config user.email ci@semanticallyinvalid.net
      git config user.name vizml-ci
      git add deploy/k8s/kustomization.yaml
      git diff --cached --quiet && exit 0
      git commit -m "chore(deploy): release $IMAGE_TAG [skip ci]"
      git push "https://gitops:${GITOPS_TOKEN}@gitlab.semanticallyinvalid.net/${CI_PROJECT_PATH}.git" HEAD:deploy
      if [ -n "${ARGO_WEBHOOK_URL:-}" ] && [ -n "${ARGO_WEBHOOK_SECRET:-}" ]; then
        sha=$(git rev-parse HEAD)
        payload=$(printf '{"ref":"refs/heads/deploy","after":"%s","repository":{"clone_url":"http://gitlab-webservice-default.gitlab:8181/%s.git"}}' "$sha" "$CI_PROJECT_PATH")
        signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$ARGO_WEBHOOK_SECRET" -hex | awk '{print $NF}')
        curl -fsS -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' -H "X-Hub-Signature-256: sha256=$signature" --data "$payload" "$ARGO_WEBHOOK_URL" || echo 'Webhook failed; Argo CD polling will reconcile'
      fi
