apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: { name: vizml, namespace: argocd }
spec:
  description: VizML architecture workbench
  sourceRepos:
    - http://gitlab-webservice-default.gitlab:8181/MichaelMcCulloch/vizml.git
  destinations:
    - { server: 'https://kubernetes.default.svc', namespace: vizml }
  namespaceResourceWhitelist:
    - { group: '*', kind: '*' }
