apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: vizml }
spec:
  parentRefs:
    - { name: gateway, namespace: gateway, sectionName: https }
  hostnames: [vizml.semanticallyinvalid.net]
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: vizml-frontend, port: 80, weight: 1 }
