apiVersion: apps/v1
kind: Deployment
metadata: { name: vizml-engine }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: vizml-engine }
  template:
    metadata:
      labels: { app: vizml-engine }
    spec:
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: engine
          image: registry.semanticallyinvalid.net/michaelmcculloch/vizml/engine:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: VIZML_APP_URL, value: "https://vizml.semanticallyinvalid.net/" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 8Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: vizml-data }
---
apiVersion: v1
kind: Service
metadata: { name: vizml-engine }
spec:
  selector: { app: vizml-engine }
  ports: [{ port: 8000, targetPort: 8000 }]
